# .github/workflows/devdiff-fast.yml

name: DevDiff Fast Changelog

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  changelog:
    runs-on: ubuntu-latest
    timeout-minutes: 5 # Hard limit — never runs longer than 5 min

    steps:
      # ── Step 1: Checkout (minimal fetch for speed) ──
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50

      # ── Step 2: Setup pnpm and Node ──
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      # ── Step 3: Install and Build CLI ──
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Core & CLI
        run: |
          pnpm --filter @eldrex/core build
          pnpm --filter @eldrex/cli build

      # ── Step 4: Generate changelog via CLI (fast path) ──
      - name: Generate Changelog
        id: changelog
        run: |
          RANGE="${{ github.event.before }}..${{ github.sha }}"
          if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ] || [ -z "${{ github.event.before }}" ]; then
            RANGE="HEAD~1..HEAD"
          fi
          node packages/cli/dist/index.js generate \
            --range "$RANGE" \
            --dry-run \
            --output CHANGELOG_PREVIEW.md || true

      # ── Step 5: Post PR comment (only if PR) ──
      - name: Comment PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            if (fs.existsSync('CHANGELOG_PREVIEW.md')) {
              const changelog = fs.readFileSync('CHANGELOG_PREVIEW.md', 'utf8')
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `## 📝 DevDiff Changelog\n\n${changelog}`
              })
            }
