# .github/workflows/devdiff-fast.yml

name: DevDiff Fast Changelog

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  changelog:
    runs-on: ubuntu-latest
    timeout-minutes: 5  # Hard limit — never runs longer than 5 min

    steps:
      # ── Step 1: Checkout (minimal fetch for speed) ──
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50  # Only last 50 commits — not full history

      # ── Step 2: Setup Node (fast) ──
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      # ── Step 3: Install ONLY what's needed ──
      - name: Install DevDiff CLI
        run: npm install -g @eldrex/cli
        # Global install is fast (~2 seconds)

      # ── Step 4: SKILL.md setup (if exists) ──
      - name: Check for SKILL.md
        id: skill
        run: |
          if [ -f SKILL.md ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      # ── Step 5: Generate changelog via CLI (fast path) ──
      - name: Generate Changelog
        id: changelog
        run: |
          # Use template mode for speed (no AI waiting)
          # Or use local model if available
          devdiff generate \
            --since "${{ github.event.before }}..${{ github.sha }}" \
            --dry-run \
            --output CHANGELOG_PREVIEW.md

          echo "generated=true" >> $GITHUB_OUTPUT

      # ── Step 6: Post PR comment (only if PR) ──
      - name: Comment PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            if (fs.existsSync('CHANGELOG_PREVIEW.md')) {
              const changelog = fs.readFileSync('CHANGELOG_PREVIEW.md', 'utf8')
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `## 📝 DevDiff Changelog\n\n${changelog}`
              })
            }

      # ── Step 7: Commit changelog (only on main) ──
      - name: Commit Changelog
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "devdiff[bot]"
          git config user.email "bot@devdiff.dev"

          if [ -f CHANGELOG_PREVIEW.md ]; then
            cp CHANGELOG_PREVIEW.md CHANGELOG.md
            git add CHANGELOG.md
            git diff --staged --quiet || git commit -m "docs: update changelog [skip ci]" && git push
          fi
