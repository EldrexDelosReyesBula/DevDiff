# .github/workflows/devdiff-changelog.yml

name: DevDiff Automated Changelog

on:
  push:
    branches: [main, develop]
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  changelog:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for accurate diff analysis

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build DevDiff
        run: pnpm build

      - name: Detect Local Models (Optional)
        run: |
          # If using Ollama in CI (self-hosted runners)
          if command -v ollama &> /dev/null; then
            ollama pull llama3.2:3b
            echo "OLLAMA_AVAILABLE=true" >> $GITHUB_ENV
          fi

      - name: Generate Changelog
        id: changelog
        run: |
          RANGE="${{ github.event.before }}..${{ github.sha }}"
          if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ] || [ -z "${{ github.event.before }}" ]; then
            RANGE="HEAD~1..HEAD"
          fi
          node packages/cli/dist/index.js generate \
            --range "$RANGE" \
            --persona developer \
            --format markdown \
            --output CHANGELOG_PREVIEW.md
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Security Scan
        id: security
        run: |
          RANGE="${{ github.event.before }}..${{ github.sha }}"
          if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ] || [ -z "${{ github.event.before }}" ]; then
            RANGE="HEAD~1..HEAD"
          fi
          node scripts/security-scan.js "$RANGE"

      - name: Post PR Comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            if (!fs.existsSync('CHANGELOG_PREVIEW.md')) {
              console.log('No CHANGELOG_PREVIEW.md found. Skipping comment.')
              return
            }
            const changelog = fs.readFileSync('CHANGELOG_PREVIEW.md', 'utf8')

            // Post changelog as PR comment
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## 📝 DevDiff Changelog\n\n${changelog}\n\n---\n*Generated by DevDiff • [Docs](https://devdiff.dev)*`
            })

      - name: Block Merge on Security Issues
        if: github.event_name == 'pull_request' && steps.security.outputs.critical > 0
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## 🔒 Security Alert\n\nDevDiff detected **${steps.security.outputs.critical} critical** and **${steps.security.outputs.high} high** security issues.\n\n⚠️ **Do not merge** until these are resolved.\n\nFull report: [View Details](${{ steps.security.outputs.report-url }})`
            })

            // Add blocking label
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['🔒 security-blocked']
            })

      - name: Commit Changelog
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "devdiff[bot]"
          git config user.email "bot@devdiff.dev"

          if [ -f CHANGELOG_PREVIEW.md ]; then
            if [ -f CHANGELOG.md ]; then
              # Prepend new changelog
              cat CHANGELOG_PREVIEW.md <(echo "") CHANGELOG.md > CHANGELOG_TEMP.md
              mv CHANGELOG_TEMP.md CHANGELOG.md
            else
              cp CHANGELOG_PREVIEW.md CHANGELOG.md
            fi
            
            git add CHANGELOG.md
            git diff --staged --quiet || (git commit -m "docs: update changelog [skip ci]" && git push)
          else
            echo "No CHANGELOG_PREVIEW.md found. Skipping commit."
          fi
