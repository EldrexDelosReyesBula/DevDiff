<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DevDiff Playground — Enterprise Developer Workspace</title>
    <meta
      name="description"
      content="Visual changelog intelligence, AI chat, file explorer, and security auditing workspace."
    />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Markdown & Mermaid CDN -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>

    <!-- React CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
      /* ── CSS Design Tokens ─────────────────────────────────────────────── */
      :root {
        /* ── TYPOGRAPHY ── */
        --font-sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        --font-mono: "JetBrains Mono", "Fira Code", "Cascadia Code", "SF Mono", Consolas, "Liberation Mono", monospace;

        --text-xs: 0.75rem;
        --text-sm: 0.875rem;
        --text-base: 1rem;
        --text-lg: 1.125rem;
        --text-xl: 1.25rem;
        --text-2xl: 1.5rem;
        --text-3xl: 1.875rem;

        --leading-tight: 1.25;
        --leading-snug: 1.375;
        --leading-normal: 1.6;

        --font-normal: 400;
        --font-medium: 500;
        --font-semibold: 600;
        --font-bold: 700;

        /* ── SPACING ── */
        --space-0: 0;
        --space-1: 0.25rem;
        --space-2: 0.5rem;
        --space-3: 0.75rem;
        --space-4: 1rem;
        --space-5: 1.25rem;
        --space-6: 1.5rem;
        --space-8: 2rem;
        --space-10: 2.5rem;
        --space-12: 3rem;

        /* ── BORDER RADIUS ── */
        --radius-none: 0;
        --radius-sm: 0.25rem;
        --radius-md: 0.5rem;
        --radius-lg: 0.75rem;
        --radius-xl: 1rem;
        --radius-2xl: 1.5rem;
        --radius-full: 9999px;

        /* ── SHADOWS ── */
        --shadow-none: 0 0 0 0 transparent;
        --shadow-xs: 0 1px 2px 0 rgb(0 0 0 / 0.05);
        --shadow-sm: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
        --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
        --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
        --shadow-2xl: 0 25px 50px -12px rgb(0 0 0 / 0.25);

        --glow-primary: 0 0 0 3px rgb(99 102 241 / 0.3);

        /* ── TRANSITIONS ── */
        --transition-fast: 150ms cubic-bezier(0.4, 0, 0.2, 1);
        --transition-base: 200ms cubic-bezier(0.4, 0, 0.2, 1);

        /* ── COLORS (DARK THEME - DEFAULT SURFACES) ── */
        --color-bg: #0a0a0f;
        --color-bg-secondary: #131320;
        --color-bg-tertiary: #1a1a2e;
        --color-bg-elevated: #1e1e32;
        --color-bg-overlay: rgb(0 0 0 / 0.7);

        --color-border: #2a2a3e;
        --color-border-light: #1e1e32;
        --color-border-strong: #3a3a50;

        --color-text: #f1f5f9;
        --color-text-secondary: #94a3b8;
        --color-text-tertiary: #64748b;
        --color-text-inverse: #0f172a;
        --color-text-link: #818cf8;
        --color-text-link-hover: #a5b4fc;

        --color-primary: #818cf8;
        --color-primary-hover: #6366f1;
        --color-primary-light: #1e1b4b;
        --color-primary-text: #ffffff;

        --color-success: #34d399;
        --color-warning: #fbbf24;
        --color-danger: #f87171;
        --color-info: #60a5fa;

        /* ── LOCAL ALIASES ── */
        --bg: var(--color-bg);
        --bg-secondary: var(--color-bg-secondary);
        --bg-elevated: var(--color-bg-elevated);
        --bg-overlay: var(--color-bg-overlay);
        --border: var(--color-border);
        --border-focus: var(--color-primary);
        --text: var(--color-text);
        --text-secondary: var(--color-text-secondary);
        --text-tertiary: var(--color-text-tertiary);

        --primary: var(--color-primary);
        --primary-hover: var(--color-primary-hover);
        --primary-shadow: var(--glow-primary);

        --success: var(--color-success);
        --warning: var(--color-warning);
        --danger: var(--color-danger);
        --info: var(--color-info);

        --z-sticky: 10;
        --z-overlay: 100;
      }

      body.light-theme {
        --color-bg: #ffffff;
        --color-bg-secondary: #f8fafc;
        --color-bg-tertiary: #f1f5f9;
        --color-bg-elevated: #ffffff;
        --color-bg-overlay: rgb(15 23 42 / 0.5);

        --color-border: #e2e8f0;
        --color-border-light: #f1f5f9;
        --color-border-strong: #cbd5e1;

        --color-text: #0f172a;
        --color-text-secondary: #475569;
        --color-text-tertiary: #94a3b8;
        --color-text-inverse: #ffffff;
        --color-text-link: #4f46e5;
        --color-text-link-hover: #4338ca;

        --color-primary: #6366f1;
        --color-primary-hover: #4f46e5;
        --color-primary-light: #eef2ff;
        --color-primary-text: #ffffff;

        --color-success: #22c55e;
        --color-warning: #f59e0b;
        --color-danger: #ef4444;
        --color-info: #3b82f6;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: var(--font-sans);
        background: var(--bg);
        color: var(--text);
        overflow: hidden;
      }

      /* ── Root Layout ─────────────────────────────────────── */
      .playground {
        display: grid;
        height: 100vh;
        height: 100dvh;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        grid-template-areas:
          "header"
          "main"
          "statusbar";
        grid-template-rows: 48px 1fr 28px;
        grid-template-columns: 1fr;
      }

      @media (min-width: 768px) {
        .playground {
          grid-template-areas:
            "sidebar header"
            "sidebar main"
            "sidebar statusbar";
          grid-template-rows: 48px 1fr 28px;
          grid-template-columns: 260px 1fr;
        }
      }

      @media (min-width: 1200px) {
        .playground {
          grid-template-areas:
            "sidebar header header"
            "sidebar main panel"
            "sidebar statusbar statusbar";
          grid-template-rows: 48px 1fr 28px;
          grid-template-columns: 280px 1fr 360px;
        }
      }

      @media (min-width: 1600px) {
        .playground {
          grid-template-columns: 300px 1fr 420px;
        }
      }

      /* ── Header ──────────────────────────────────────────── */
      .playground-header {
        grid-area: header;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 16px;
        background: var(--bg-elevated);
        border-bottom: 1px solid var(--border);
        z-index: var(--z-sticky);
        gap: 12px;
        min-height: 48px;
      }

      .playground-header-left {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
      }

      .playground-header-center {
        display: none;
      }

      @media (min-width: 768px) {
        .playground-header-center {
          display: flex;
          align-items: center;
          flex: 1;
          max-width: 600px;
          margin: 0 auto;
        }
      }

      .playground-header-right {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      /* ── Sidebar ─────────────────────────────────────────── */
      .playground-sidebar {
        grid-area: sidebar;
        background: var(--bg-secondary);
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        z-index: var(--z-sticky);
      }

      /* ── Main Content ────────────────────────────────────── */
      .playground-main {
        grid-area: main;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        min-height: 0;
      }

      /* ── Right Panel (Desktop) ───────────────────────────── */
      .playground-panel {
        display: none;
        grid-area: panel;
      }

      @media (min-width: 1200px) {
        .playground-panel {
          display: flex;
          flex-direction: column;
          background: var(--bg-secondary);
          border-left: 1px solid var(--border);
          overflow: hidden;
        }
      }

      /* ── Status Bar ──────────────────────────────────────── */
      .playground-statusbar {
        grid-area: statusbar;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 12px;
        background: var(--bg-elevated);
        border-top: 1px solid var(--border);
        font-size: 11px;
        color: var(--text-tertiary);
        gap: 12px;
        overflow: hidden;
      }

      /* ── Mobile & Tablet Responsiveness Overrides ─────────── */
      @media (max-width: 767px) {
        .playground {
          grid-template-areas:
            "header"
            "main"
            "mobile-nav";
          grid-template-rows: 48px 1fr 56px;
          grid-template-columns: 1fr;
        }
        
        .playground-sidebar {
          display: none;
        }
        
        .playground-sidebar.mobile-visible {
          display: flex;
          grid-area: main;
          border-right: none;
        }
        
        .playground-main {
          display: none;
        }
        
        .playground-main.mobile-visible {
          display: flex;
          grid-area: main;
        }
        
        .playground-panel {
          display: none !important;
        }
        
        .playground-panel.mobile-visible {
          display: flex !important;
          grid-area: main;
          border-left: none;
        }
        
        .playground-statusbar {
          display: none;
        }
      }

      /* ── Mobile Bottom Navigation Tab Bar ─────────────────── */
      .mobile-tab-bar {
        display: none;
      }

      @media (max-width: 767px) {
        .mobile-tab-bar {
          grid-area: mobile-nav;
          display: flex;
          background: var(--bg-elevated);
          border-top: 1px solid var(--border);
          z-index: var(--z-sticky);
          padding-bottom: env(safe-area-inset-bottom);
        }
        
        .mobile-tab {
          flex: 1;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 2px;
          font-size: 10px;
          color: var(--text-tertiary);
          border: none;
          background: none;
          cursor: pointer;
          height: 100%;
        }
        
        .mobile-tab.active {
          color: var(--primary);
        }
      }

      /* ── Sidebar: File Explorer Tree ───────────────────────── */
      .file-explorer {
        display: flex;
        flex-direction: column;
        height: 100%;
        overflow: hidden;
      }

      .file-explorer-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 16px;
        border-bottom: 1px solid var(--border);
      }

      .file-explorer-title {
        font-size: 13px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .file-explorer-actions {
        display: flex;
        gap: 4px;
      }

      .file-explorer-search {
        position: relative;
        padding: 8px 12px;
      }

      .file-explorer-search input {
        width: 100%;
        padding: 6px 10px 6px 28px;
        background: var(--bg-elevated);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        color: var(--text);
        font-size: 12px;
      }

      .file-explorer-search input:focus {
        outline: none;
        border-color: var(--primary);
      }

      .file-explorer-search .search-icon {
        position: absolute;
        left: 20px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text-tertiary);
      }

      .file-explorer-filter {
        display: flex;
        padding: 0 12px 8px;
        border-bottom: 1px solid var(--border);
        gap: 4px;
      }

      .filter-tab {
        flex: 1;
        padding: 4px;
        font-size: 11px;
        background: transparent;
        border: 1px solid transparent;
        border-radius: var(--radius-sm);
        color: var(--text-secondary);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 4px;
      }

      .filter-tab.active {
        background: var(--bg-elevated);
        border-color: var(--border);
        color: var(--text);
      }

      .filter-tab .badge {
        font-size: 9px;
        background: var(--primary);
        color: #fff;
        padding: 1px 4px;
        border-radius: 8px;
      }

      .file-explorer-tree {
        flex: 1;
        overflow-y: auto;
        padding: 8px 0;
      }

      .file-tree-node {
        display: flex;
        align-items: center;
        height: 28px;
        cursor: pointer;
        font-size: 12px;
        color: var(--text-secondary);
        padding-right: 12px;
        border-left: 2px solid transparent;
      }

      .file-tree-node:hover {
        background: rgba(255, 255, 255, 0.02);
      }

      .file-tree-node.selected {
        background: rgba(99, 102, 241, 0.1);
        border-left-color: var(--primary);
        color: var(--text);
      }

      .file-tree-node .arrow {
        width: 16px;
        height: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text-tertiary);
        transition: transform var(--transition-base);
      }

      .file-tree-node .arrow.expanded {
        transform: rotate(90deg);
      }

      .file-tree-node .icon {
        margin-right: 6px;
        display: flex;
        align-items: center;
      }

      .file-tree-node .name {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .file-tree-node.git-added { color: var(--success); }
      .file-tree-node.git-modified { color: var(--info); }
      .file-tree-node.git-deleted { color: var(--danger); text-decoration: line-through; }
      .file-tree-node.git-renamed { color: #c084fc; }

      .git-indicator {
        font-size: 9px;
        font-weight: 700;
        padding: 1px 4px;
        border-radius: 4px;
        margin-left: 6px;
      }
      .git-indicator.git-added { background: rgba(16, 185, 129, 0.15); color: var(--success); }
      .git-indicator.git-modified { background: rgba(6, 182, 212, 0.15); color: var(--info); }
      .git-indicator.git-deleted { background: rgba(239, 68, 68, 0.15); color: var(--danger); }
      .git-indicator.git-renamed { background: rgba(192, 132, 252, 0.15); color: #c084fc; }

      /* ── Project Switcher ─────────────────────────────────── */
      .project-switcher-trigger {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 12px;
        background: var(--bg-elevated);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        color: var(--text);
        font-family: inherit;
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
        max-width: 180px;
      }

      .project-switcher-trigger:hover {
        border-color: var(--primary);
      }

      .project-switcher-trigger .project-name {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .modal-overlay {
        position: fixed;
        inset: 0;
        background: var(--bg-overlay);
        backdrop-filter: blur(4px);
        z-index: var(--z-overlay);
      }

      .project-switcher-modal {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 90vw;
        max-width: 500px;
        background: var(--bg-secondary);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-2xl);
        z-index: calc(var(--z-overlay) + 1);
        display: flex;
        flex-direction: column;
        max-height: 80vh;
      }

      .modal-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 16px 20px;
        border-bottom: 1px solid var(--border);
      }

      .modal-header h2 {
        font-size: 15px;
        font-weight: 600;
      }

      .modal-body {
        padding: 20px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .open-folder-btn {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        padding: 14px;
        background: var(--bg-elevated);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        color: var(--text);
        cursor: pointer;
        text-align: left;
      }

      .open-folder-btn:hover {
        border-color: var(--primary);
      }

      .open-folder-text {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .open-folder-text strong {
        font-size: 13px;
      }

      .open-folder-text span {
        font-size: 11px;
        color: var(--text-secondary);
      }

      .recent-projects {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .section-title {
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: var(--text-tertiary);
      }

      .recent-list {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .recent-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
        background: var(--bg-elevated);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        color: var(--text);
        cursor: pointer;
        text-align: left;
        width: 100%;
      }

      .recent-item:hover {
        border-color: var(--primary);
      }

      .recent-info {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
      }

      .recent-name {
        font-size: 12px;
        font-weight: 500;
      }

      .recent-path {
        font-size: 10px;
        color: var(--text-secondary);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      /* ── AI Chat Panel ───────────────────────────────────── */
      .chat-panel {
        display: flex;
        flex-direction: column;
        height: 100%;
        overflow: hidden;
        background: var(--bg-secondary);
      }

      .chat-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 16px;
        border-bottom: 1px solid var(--border);
      }

      .chat-title {
        font-size: 13px;
        font-weight: 600;
        text-transform: uppercase;
      }

      .model-selector {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .model-selector select {
        padding: 4px 8px;
        background: var(--bg-elevated);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        color: var(--text);
        font-size: 11px;
      }

      .chat-modes {
        display: flex;
        padding: 6px 12px;
        background: var(--bg);
        border-bottom: 1px solid var(--border);
        gap: 4px;
      }

      .mode-btn {
        flex: 1;
        padding: 6px;
        font-size: 11px;
        background: transparent;
        border: none;
        color: var(--text-secondary);
        cursor: pointer;
        border-bottom: 2px solid transparent;
      }

      .mode-btn.active {
        color: var(--primary);
        border-bottom-color: var(--primary);
        font-weight: 600;
      }

      .chat-messages {
        flex: 1;
        overflow-y: auto;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .chat-welcome {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        text-align: center;
        padding: 24px;
        color: var(--text-secondary);
        gap: 12px;
      }

      .welcome-icon {
        color: var(--primary);
        margin-bottom: 8px;
      }

      .suggestion-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        justify-content: center;
        margin-top: 12px;
      }

      .suggestion-chips button {
        padding: 6px 12px;
        background: var(--bg-elevated);
        border: 1px solid var(--border);
        border-radius: 20px;
        color: var(--text);
        font-size: 11px;
        cursor: pointer;
      }

      .suggestion-chips button:hover {
        border-color: var(--primary);
      }

      .chat-message {
        display: flex;
        gap: 12px;
        padding: 12px;
        background: var(--bg-elevated);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        animation: slideInMsg 0.25s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      }

      @keyframes slideInMsg {
        from { opacity: 0; transform: translateY(12px); }
        to { opacity: 1; transform: translateY(0); }
      }

      .chat-message.user {
        background: rgba(99, 102, 241, 0.05);
        border-color: rgba(99, 102, 241, 0.2);
      }

      .message-avatar {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: var(--bg);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text-secondary);
      }

      .message-content {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 6px;
        min-width: 0;
      }

      .message-header {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 11px;
      }

      .message-role {
        font-weight: 600;
      }

      .message-model {
        color: var(--text-tertiary);
        background: var(--bg);
        padding: 1px 6px;
        border-radius: 4px;
      }

      .message-confidence {
        padding: 1px 6px;
        border-radius: 4px;
        font-weight: 600;
      }
      .message-confidence.high { background: rgba(16, 185, 129, 0.1); color: var(--success); }
      .message-confidence.medium { background: rgba(245, 158, 11, 0.1); color: var(--warning); }
      .message-confidence.low { background: rgba(239, 68, 68, 0.1); color: var(--danger); }

      .message-body {
        font-size: 12.5px;
        line-height: 1.6;
        color: var(--text);
      }

      .message-body p {
        margin-bottom: 8px;
      }

      .message-body pre {
        background: var(--bg);
        padding: 10px;
        border-radius: var(--radius-sm);
        overflow-x: auto;
        font-family: var(--font-mono);
        font-size: 11px;
        margin: 8px 0;
      }

      /* ── Typing Animation ────────────────────────────────── */
      .typing-dots {
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 4px 8px;
      }

      .typing-dot {
        width: 6px;
        height: 6px;
        background-color: var(--primary);
        border-radius: 50%;
        animation: bounce 1.4s infinite ease-in-out both;
      }

      .typing-dot:nth-child(1) { animation-delay: -0.32s; }
      .typing-dot:nth-child(2) { animation-delay: -0.16s; }

      @keyframes bounce {
        0%, 80%, 100% { transform: scale(0); }
        40% { transform: scale(1.0); }
      }

      /* ── Chat Input ───────────────────────────────────────── */
      .chat-input-container {
        padding: 12px;
        border-top: 1px solid var(--border);
      }

      .chat-input-wrapper {
        display: flex;
        flex-direction: column;
        background: var(--bg-elevated);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        padding: 8px;
        gap: 8px;
      }

      .chat-input {
        width: 100%;
        background: transparent;
        border: none;
        color: var(--text);
        font-size: 12px;
        font-family: inherit;
        resize: none;
        min-height: 28px;
      }

      .chat-input:focus {
        outline: none;
      }

      .chat-input-actions {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 11px;
        color: var(--text-tertiary);
      }

      /* ── Central Code/Diff Editor View ─────────────────────── */
      .editor-container {
        display: flex;
        flex-direction: column;
        height: 100%;
        overflow: hidden;
      }

      .editor-tabs {
        display: flex;
        background: var(--bg-secondary);
        border-bottom: 1px solid var(--border);
        padding: 0 12px;
      }

      .editor-tab {
        padding: 10px 16px;
        font-size: 12px;
        background: transparent;
        border: none;
        color: var(--text-secondary);
        cursor: pointer;
        border-bottom: 2px solid transparent;
      }

      .editor-tab.active {
        color: var(--primary);
        border-bottom-color: var(--primary);
        font-weight: 500;
      }

      .editor-body {
        flex: 1;
        overflow: auto;
        background: var(--bg);
        padding: 20px;
        font-family: var(--font-mono);
        font-size: 12px;
        line-height: 1.5;
        white-space: pre-wrap;
      }

      .diff-line {
        padding: 2px 4px;
      }
      .diff-line.addition { background: rgba(16, 185, 129, 0.1); color: #34d399; }
      .diff-line.deletion { background: rgba(239, 68, 68, 0.1); color: #f87171; }

      .empty-editor {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        color: var(--text-tertiary);
        gap: 12px;
        text-align: center;
        padding: 24px;
      }

      /* ── Right Details Panel ────────────────────────────── */
      .details-panel {
        display: flex;
        flex-direction: column;
        height: 100%;
        overflow: hidden;
      }

      .panel-tabs {
        display: flex;
        background: var(--bg);
        border-bottom: 1px solid var(--border);
      }

      .panel-tab {
        flex: 1;
        padding: 10px 4px;
        font-size: 11px;
        background: transparent;
        border: none;
        color: var(--text-secondary);
        cursor: pointer;
        text-align: center;
        border-bottom: 2px solid transparent;
      }

      .panel-tab.active {
        color: var(--primary);
        border-bottom-color: var(--primary);
        font-weight: 600;
      }

      .panel-content {
        flex: 1;
        overflow-y: auto;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      /* Accordion Component */
      .accordion {
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        overflow: hidden;
        background: var(--bg-elevated);
      }

      .accordion-header {
        width: 100%;
        display: flex;
        align-items: center;
        padding: 10px 12px;
        background: rgba(255, 255, 255, 0.01);
        border: none;
        color: var(--text);
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
        text-align: left;
        gap: 8px;
      }

      .accordion-header:hover {
        background: rgba(255, 255, 255, 0.03);
      }

      .accordion-icon {
        display: flex;
        align-items: center;
        color: var(--text-tertiary);
      }

      .accordion-icon .chevron {
        transition: transform var(--transition-base);
      }

      .accordion-icon .chevron.rotated {
        transform: rotate(90deg);
      }

      .accordion-content {
        padding: 12px;
        border-top: 1px solid var(--border);
        font-size: 11.5px;
        color: var(--text-secondary);
        line-height: 1.6;
      }

      .stat-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
      }

      .stat-card {
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        padding: 10px;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .stat-num {
        font-size: 16px;
        font-weight: 700;
        font-family: var(--font-mono);
        color: var(--info);
      }

      .stat-label {
        font-size: 10px;
        color: var(--text-tertiary);
        text-transform: uppercase;
        letter-spacing: 0.3px;
      }

      /* ── UI utilities & Buttons ────────────────────────────── */
      .dev-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 6px 12px;
        font-size: 12px;
        font-weight: 500;
        border-radius: var(--radius-sm);
        cursor: pointer;
        border: 1px solid transparent;
        font-family: inherit;
        gap: 6px;
        transition: var(--transition-base);
      }

      .dev-btn-primary {
        background: var(--primary);
        color: #fff;
        box-shadow: 0 2px 8px var(--primary-shadow);
      }
      .dev-btn-primary:hover {
        background: var(--primary-hover);
      }

      .dev-btn-secondary {
        background: var(--bg-elevated);
        border-color: var(--border);
        color: var(--text);
      }
      .dev-btn-secondary:hover {
        background: var(--bg-secondary);
      }

      .dev-btn-ghost {
        background: transparent;
        color: var(--text-secondary);
      }
      .dev-btn-ghost:hover {
        background: rgba(255, 255, 255, 0.04);
        color: var(--text);
      }

      .dev-btn-sm {
        padding: 4px 8px;
        font-size: 11px;
      }

      .dev-btn-icon {
        padding: 6px;
        border-radius: 50%;
      }

      .pulse-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background-color: var(--success);
        display: inline-block;
      }
      .pulse-dot.disconnected {
        background-color: var(--danger);
      }

      /* Toast Notification */
      .toast {
        position: fixed;
        bottom: 24px;
        right: 24px;
        background: var(--bg-elevated);
        border: 1px solid var(--border);
        border-left: 4px solid var(--primary);
        color: var(--text);
        padding: 12px 18px;
        border-radius: var(--radius-sm);
        box-shadow: var(--shadow-lg);
        z-index: 1000;
        font-size: 12px;
        animation: slideIn 0.25s ease-out;
      }

      @keyframes slideIn {
        from { transform: translateY(100%); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useRef } = React;

      // Dynamic backend host configuration resolving CORS/different ports issues (e.g. VS Code Live Server port 5500)
      const apiBase = window.location.port === "3737" ? "" : "http://localhost:3737";

      // ── Clean SVG Icons ─────────────────────────────────────────────────
      const SparklesIcon = ({ size = 16 }) => (
        <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/><path d="m5 3 1 2.5L8.5 6 6 7 5 9.5 4 7 1.5 6 4 5 5 3Z" opacity="0.6"/><path d="m19 17 1 2.5 2.5.5-2.5 1-1 2.5-1-2.5-2.5-1 2.5-1 1-2.5Z" opacity="0.6"/></svg>
      );
      const FolderIcon = ({ size = 16 }) => (
        <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>
      );
      const FolderOpenIcon = ({ size = 16 }) => (
        <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m6 14 1.45-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.55 6a2 2 0 0 1-1.94 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.93a2 2 0 0 1 1.66.9l.82 1.2a2 2 0 0 0 1.66.9H18a2 2 0 0 1 2 2v2"/></svg>
      );
      const FileIcon = ({ size = 16 }) => (
        <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/></svg>
      );
      const ChevronRightIcon = ({ size = 16, className = "" }) => (
        <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m9 18 6-6-6-6"/></svg>
      );
      const ChevronDownIcon = ({ size = 16 }) => (
        <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m6 9 6 6 6-6"/></svg>
      );
      const RefreshIcon = ({ size = 16 }) => (
        <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M16 3h5v5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 21H3v-5"/></svg>
      );
      const SearchIcon = ({ size = 16, className = "" }) => (
        <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      );
      const XIcon = ({ size = 16 }) => (
        <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      );
      const UserIcon = ({ size = 16 }) => (
        <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      );
      const BotIcon = ({ size = 16 }) => (
        <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></svg>
      );

      // ── Accordion Component ──────────────────────────────────────────────
      const Accordion = ({ title, icon, defaultOpen = false, children, badge }) => {
        const [isOpen, setIsOpen] = useState(defaultOpen);
        return (
          <div className={`accordion ${isOpen ? 'open' : ''}`}>
            <button className="accordion-header" onClick={() => setIsOpen(!isOpen)} aria-expanded={isOpen}>
              <span className="accordion-icon">
                <ChevronRightIcon size={12} className={`chevron ${isOpen ? 'rotated' : ''}`} />
              </span>
              {icon && <span style={{ marginRight: '6px', display: 'flex', alignItems: 'center' }}>{icon}</span>}
              <span className="accordion-title" style={{ flex: 1 }}>{title}</span>
              {badge && <span className="git-indicator git-modified">{badge}</span>}
            </button>
            {isOpen && <div className="accordion-content" role="region">{children}</div>}
          </div>
        );
      };

      // ── Main App Container ───────────────────────────────────────────────
      const App = () => {
        const [workspace, setWorkspace] = useState(null);
        const [stats, setStats] = useState(null);
        const [files, setFiles] = useState([]);
        const [selectedFile, setSelectedFile] = useState(null);
        const [fileContent, setFileContent] = useState("");
        const [fileDiff, setFileDiff] = useState("");
        const [editorTab, setEditorTab] = useState("code"); // code | diff
        const [searchQuery, setSearchQuery] = useState("");
        const [filter, setFilter] = useState("all"); // all | changed | staged
        const [expandedPaths, setExpandedPaths] = useState(new Set());
        const [selectedPath, setSelectedPath] = useState(null);
        const [recentProjects, setRecentProjects] = useState([]);
        const [isProjectSwitcherOpen, setIsProjectSwitcherOpen] = useState(false);
        const [activePanelTab, setActivePanelTab] = useState("details"); // details | changelog | history | settings

        // Mobile View States
        const [mobileViewTab, setMobileViewTab] = useState("explorer"); // explorer | editor | chat | settings

        // AI Chat states
        const [messages, setMessages] = useState([]);
        const [chatInput, setChatInput] = useState("");
        const [isStreaming, setIsStreaming] = useState(false);
        const [selectedModel, setSelectedModel] = useState("auto");
        const [availableModels, setAvailableModels] = useState([]);
        const [chatMode, setChatMode] = useState("chat"); // chat | changelog | security | explain
        
        // Theme
        const [theme, setTheme] = useState("dark"); // dark | light

        // Session timer
        const [sessionSeconds, setSessionSeconds] = useState(0);

        // Refs
        const messagesEndRef = useRef(null);
        const chatInputRef = useRef(null);

        // Load data on mount
        useEffect(() => {
          refreshWorkspace();
          loadRecentProjects();
          detectModels();

          // Session timer interval
          const interval = setInterval(() => {
            setSessionSeconds(prev => prev + 1);
          }, 1000);

          // Keyboard Shortcuts Listener
          const shortcutsHandler = (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'l') {
              e.preventDefault();
              setMobileViewTab("chat");
              setActivePanelTab("changelog");
              setTimeout(() => chatInputRef.current?.focus(), 50);
              showToast("Focused AI Chat (Ctrl+L)");
            }
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'p') {
              e.preventDefault();
              setIsProjectSwitcherOpen(true);
            }
          };
          window.addEventListener('keydown', shortcutsHandler);

          return () => {
            clearInterval(interval);
            window.removeEventListener('keydown', shortcutsHandler);
          };
        }, []);

        useEffect(() => {
          messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
        }, [messages, isStreaming]);

        // Helpers
        const showToast = (msg) => {
          const el = document.createElement("div");
          el.className = "toast";
          el.innerHTML = msg;
          document.body.appendChild(el);
          setTimeout(() => el.remove(), 3000);
        };

        const refreshWorkspace = async () => {
          try {
            const wsRes = await fetch(`${apiBase}/api/workspace`);
            const wsData = await wsRes.json();
            setWorkspace(wsData);

            const statsRes = await fetch(`${apiBase}/api/stats`);
            const statsData = await statsRes.json();
            setStats(statsData);

            const filesRes = await fetch(`${apiBase}/api/files`);
            const filesData = await filesRes.json();
            setFiles(Array.isArray(filesData) ? filesData : []);
          } catch (err) {
            console.error("Failed to load workspace data:", err);
          }
        };

        const detectModels = async () => {
          try {
            const res = await fetch(`${apiBase}/api/models`);
            const data = await res.json();
            setAvailableModels(data);
          } catch (err) {
            console.error("Failed to fetch models:", err);
          }
        };

        const loadRecentProjects = () => {
          const saved = localStorage.getItem('devdiff-recent-projects');
          if (saved) {
            setRecentProjects(JSON.parse(saved));
          }
        };

        const addProjectToRecent = (pathStr) => {
          const newProject = {
            path: pathStr,
            name: pathStr.split(/[/\\]/).pop() || pathStr,
            lastOpened: new Date().toISOString(),
          };
          const filtered = recentProjects.filter(p => p.path !== pathStr);
          const updated = [newProject, ...filtered].slice(0, 5);
          setRecentProjects(updated);
          localStorage.setItem('devdiff-recent-projects', JSON.stringify(updated));
        };

        const switchProject = async (pathStr) => {
          try {
            const res = await fetch(`${apiBase}/api/workspace/open`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ path: pathStr }),
            });
            const data = await res.json();
            if (data.success) {
              addProjectToRecent(pathStr);
              setIsProjectSwitcherOpen(false);
              showToast(`Switched workspace to: ${newProjectName(pathStr)}`);
              refreshWorkspace();
            } else {
              alert(data.error || "Failed to switch project");
            }
          } catch (err) {
            console.error(err);
          }
        };

        const newProjectName = (pathStr) => {
          return pathStr.split(/[/\\]/).pop() || pathStr;
        };

        const toggleFolder = (pathStr) => {
          const updated = new Set(expandedPaths);
          if (updated.has(pathStr)) {
            updated.delete(pathStr);
          } else {
            updated.add(pathStr);
          }
          setExpandedPaths(updated);
        };

        const selectFile = async (node) => {
          setSelectedFile(node);
          setSelectedPath(node.path);
          setEditorTab("code");
          setMobileViewTab("editor"); // auto view editor on mobile when file clicked
          try {
            const contentRes = await fetch(`${apiBase}/api/file/content?path=${encodeURIComponent(node.path)}`);
            const contentData = await contentRes.json();
            setFileContent(contentData.content || "");

            if (node.gitStatus) {
              const diffRes = await fetch(`${apiBase}/api/git/diff?path=${encodeURIComponent(node.path)}`);
              const diffData = await diffRes.json();
              setFileDiff(diffData.diff || "");
            } else {
              setFileDiff("");
            }
          } catch (err) {
            console.error(err);
          }
        };

        const stageFile = async (pathStr) => {
          try {
            const res = await fetch(`${apiBase}/api/git/stage`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ path: pathStr }),
            });
            const data = await res.json();
            if (data.success) {
              showToast(`Staged file: ${pathStr}`);
              refreshWorkspace();
              if (selectedFile && selectedFile.path === pathStr) {
                selectFile({ ...selectedFile, gitStatus: undefined });
              }
            }
          } catch (err) {
            console.error(err);
          }
        };

        // Send Chat Message
        const sendMessage = async (overrideInput = null) => {
          const prompt = (overrideInput || chatInput).trim();
          if (!prompt) return;

          const userMsg = {
            id: `msg-${Date.now()}`,
            role: "user",
            content: prompt,
            timestamp: Date.now(),
          };

          setMessages(prev => [...prev, userMsg]);
          setChatInput("");
          setIsStreaming(true);

          try {
            const res = await fetch(`${apiBase}/api/chat?category=${chatMode}`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                message: prompt,
                model: selectedModel,
                systemPrompt: `You are the DevDiff Assistant. You have deep knowledge of the local codebase. Active Mode: ${chatMode}.`,
              }),
            });
            const data = await res.json();
            const replyMsg = {
              id: `msg-${Date.now() + 1}`,
              role: data.success ? "assistant" : "error",
              content: data.response || data.error || "An error occurred.",
              timestamp: Date.now(),
              model: selectedModel === "auto" ? "qwen2.5-coder:7b" : selectedModel,
              confidence: data.success ? 92 : undefined,
              tokens: data.success ? 342 : undefined,
            };
            setMessages(prev => [...prev, replyMsg]);
          } catch (err) {
            const errorMsg = {
              id: `msg-${Date.now() + 1}`,
              role: "error",
              content: err.message,
              timestamp: Date.now(),
            };
            setMessages(prev => [...prev, errorMsg]);
          } finally {
            setIsStreaming(false);
          }
        };

        // Flat mapping function to traverse file tree for explorer filter
        const flattenFileTree = (nodes) => {
          const flat = [];
          if (!Array.isArray(nodes)) return flat;
          const traverse = (nodeList) => {
            if (!Array.isArray(nodeList)) return;
            for (const node of nodeList) {
              flat.push(node);
              if (node.children) traverse(node.children);
            }
          };
          traverse(nodes);
          return flat;
        };

        const getFilteredTreeNodes = (nodes) => {
          if (!Array.isArray(nodes)) return [];
          if (!searchQuery && filter === "all") return nodes;

          const matchSearch = (node) => {
            return node.name && node.name.toLowerCase().includes(searchQuery.toLowerCase());
          };

          const matchFilter = (node) => {
            if (filter === "changed") return !!node.gitStatus;
            if (filter === "staged") return node.gitStatus === "added" || node.gitStatus === "modified";
            return true;
          };

          const filterNodeList = (nodeList) => {
            if (!Array.isArray(nodeList)) return [];
            return nodeList
              .map(node => {
                if (node.type === "directory") {
                  const childrenFiltered = filterNodeList(node.children || []);
                  if (childrenFiltered.length > 0 || (matchSearch(node) && filter === "all")) {
                    return { ...node, children: childrenFiltered };
                  }
                  return null;
                }
                return (matchSearch(node) && matchFilter(node)) ? node : null;
              })
              .filter(Boolean);
          };

          return filterNodeList(nodes);
        };

        const filteredFiles = getFilteredTreeNodes(files);
        const allFlatFiles = flattenFileTree(files);
        const changedCount = allFlatFiles.filter(n => !!n.gitStatus).length;
        const stagedCount = allFlatFiles.filter(n => n.gitStatus === "added" || n.gitStatus === "modified").length;

        // Recursive tree rendering
        const renderTreeNodes = (nodes, depth = 0) => {
          if (!Array.isArray(nodes)) return null;
          return nodes.map(node => {
            const isDir = node.type === "directory";
            const isExpanded = expandedPaths.has(node.path);
            const isSelected = selectedPath === node.path;

            return (
              <div key={node.path} style={{ display: 'flex', flexDirection: 'column' }}>
                <div
                  className={`file-tree-node ${isSelected ? 'selected' : ''} ${node.gitStatus ? `git-${node.gitStatus}` : ''}`}
                  style={{ paddingLeft: `${depth * 14 + 10}px` }}
                  onClick={() => {
                    if (isDir) {
                      toggleFolder(node.path);
                    } else {
                      selectFile(node);
                    }
                  }}
                >
                  {isDir ? (
                    <span className={`arrow ${isExpanded ? 'expanded' : ''}`}>
                      <ChevronRightIcon size={12} />
                    </span>
                  ) : (
                    <span style={{ width: '16px' }}></span>
                  )}
                  <span className="icon">
                    {isDir ? (
                      isExpanded ? <FolderOpenIcon size={14} /> : <FolderIcon size={14} />
                    ) : (
                      <FileIcon size={14} />
                    )}
                  </span>
                  <span className="name">{node.name}</span>
                  {node.gitStatus && (
                    <span className={`git-indicator git-${node.gitStatus}`}>
                      {node.gitStatus === 'added' ? 'A' : node.gitStatus === 'modified' ? 'M' : node.gitStatus === 'deleted' ? 'D' : 'R'}
                    </span>
                  )}
                </div>
                {isDir && isExpanded && node.children && (
                  <div>{renderTreeNodes(node.children, depth + 1)}</div>
                )}
              </div>
            );
          });
        };

        // Format elapsed session seconds
        const formatSessionTime = (totalSeconds) => {
          const m = String(Math.floor(totalSeconds / 60)).padStart(2, "0");
          const s = String(totalSeconds % 60).padStart(2, "0");
          return `${m}:${s}`;
        };

        // Switch Theme
        const toggleTheme = () => {
          const isLight = document.body.classList.toggle("light-theme");
          setTheme(isLight ? "light" : "dark");
          showToast(`Theme switched to: ${isLight ? 'Light' : 'Dark'}`);
        };

        // Mobile active states
        const showMobileExplorer = mobileViewTab === "explorer";
        const showMobileEditor = mobileViewTab === "editor";
        const showMobilePanel = mobileViewTab === "chat" || mobileViewTab === "settings";

        return (
          <div className="playground">
            {/* Header */}
            <header className="playground-header">
              <div className="playground-header-left">
                <div style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
                  <SparklesIcon size={18} />
                  <span style={{ fontWeight: 700, fontSize: '14px', letterSpacing: '-0.3px' }}>DevDiff Playground</span>
                </div>
                <div style={{ borderLeft: '1px solid var(--border)', height: '18px' }} />
                
                {/* Project Switcher trigger */}
                <button className="project-switcher-trigger" onClick={() => setIsProjectSwitcherOpen(true)}>
                  <FolderIcon size={14} />
                  <span className="project-name">{workspace ? workspace.name : "Select Project"}</span>
                  <ChevronDownIcon size={12} />
                </button>
              </div>

              <div className="playground-header-center">
                {/* AI Connection Status */}
                <div className="ai-badge connected" style={{ display: 'flex', alignItems: 'center', gap: '6px', fontSize: '11px', color: 'var(--success)' }}>
                  <span className="pulse-dot" />
                  <span>Ollama: Active</span>
                </div>
              </div>

              <div className="playground-header-right">
                <button className="dev-btn dev-btn-ghost dev-btn-sm" onClick={toggleTheme}>
                  {theme === 'dark' ? '☀️ Light' : '🌙 Dark'}
                </button>
              </div>
            </header>

            {/* Sidebar File Explorer */}
            <aside className={`playground-sidebar ${showMobileExplorer ? 'mobile-visible' : ''}`}>
              <div className="file-explorer">
                <div className="file-explorer-header">
                  <span className="file-explorer-title">Workspace files</span>
                  <div className="file-explorer-actions">
                    <button className="dev-btn dev-btn-ghost dev-btn-sm" onClick={refreshWorkspace} title="Refresh Files">
                      <RefreshIcon size={12} />
                    </button>
                  </div>
                </div>

                <div className="file-explorer-search">
                  <SearchIcon size={12} className="search-icon" />
                  <input
                    type="search"
                    placeholder="Search files..."
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                  />
                </div>

                <div className="file-explorer-filter">
                  <button className={`filter-tab ${filter === 'all' ? 'active' : ''}`} onClick={() => setFilter('all')}>
                    All
                  </button>
                  <button className={`filter-tab ${filter === 'changed' ? 'active' : ''}`} onClick={() => setFilter('changed')}>
                    Changed {changedCount > 0 && <span className="badge">{changedCount}</span>}
                  </button>
                  <button className={`filter-tab ${filter === 'staged' ? 'active' : ''}`} onClick={() => setFilter('staged')}>
                    Staged {stagedCount > 0 && <span className="badge">{stagedCount}</span>}
                  </button>
                </div>

                <div className="file-explorer-tree">
                  {files.length > 0 ? (
                    renderTreeNodes(filteredFiles)
                  ) : (
                    <div style={{ padding: '20px', textAlign: 'center', color: 'var(--text-tertiary)' }}>
                      No files loaded.
                    </div>
                  )}
                </div>
              </div>
            </aside>

            {/* Main Content Workspace */}
            <main className={`playground-main ${showMobileEditor ? 'mobile-visible' : ''}`}>
              {selectedFile ? (
                <div className="editor-container">
                  <div className="editor-tabs">
                    <button className={`editor-tab ${editorTab === 'code' ? 'active' : ''}`} onClick={() => setEditorTab('code')}>
                      Code
                    </button>
                    {selectedFile.gitStatus && (
                      <button className={`editor-tab ${editorTab === 'diff' ? 'active' : ''}`} onClick={() => setEditorTab('diff')}>
                        Diff
                      </button>
                    )}
                  </div>

                  <div className="editor-body">
                    {editorTab === 'code' ? (
                      <code>{fileContent}</code>
                    ) : (
                      <div>
                        {fileDiff ? (
                          fileDiff.split("\n").map((line, i) => {
                            let type = "";
                            if (line.startsWith("+")) type = "addition";
                            if (line.startsWith("-")) type = "deletion";
                            return (
                              <div key={i} className={`diff-line ${type}`}>
                                {line}
                              </div>
                            );
                          })
                        ) : (
                          <div style={{ color: 'var(--text-tertiary)' }}>No diff contents.</div>
                        )}
                      </div>
                    )}
                  </div>

                  {selectedFile.gitStatus && (
                    <div style={{ padding: '12px 20px', borderTop: '1px solid var(--border)', background: 'var(--bg-secondary)', display: 'flex', gap: '8px' }}>
                      <button className="dev-btn dev-btn-primary dev-btn-sm" onClick={() => stageFile(selectedFile.path)}>
                        Stage Changes
                      </button>
                      <button className="dev-btn dev-btn-secondary dev-btn-sm" onClick={() => {
                        setMobileViewTab("chat");
                        setActivePanelTab("changelog");
                        sendMessage(`Explain changes in ${selectedFile.name}`);
                      }}>
                        Explain with AI
                      </button>
                    </div>
                  )}
                </div>
              ) : (
                <div className="empty-editor">
                  <SparklesIcon size={32} />
                  <h3>Welcome to the DevDiff Playground</h3>
                  <p style={{ maxWidth: '400px', fontSize: '12px' }}>
                    Select a file from the explorer on the left to view code details, stage changes, or query Ollama about structural patterns.
                  </p>
                </div>
              )}
            </main>

            {/* Right Panel Details & AI Chat */}
            <aside className={`playground-panel ${showMobilePanel ? 'mobile-visible' : ''}`}>
              <div className="details-panel">
                <div className="panel-tabs">
                  <button className={`panel-tab ${activePanelTab === 'details' ? 'active' : ''}`} onClick={() => setActivePanelTab('details')}>
                    📋 Details
                  </button>
                  <button className={`panel-tab ${activePanelTab === 'changelog' ? 'active' : ''}`} onClick={() => setActivePanelTab('changelog')}>
                    💬 Chat
                  </button>
                  <button className={`panel-tab ${activePanelTab === 'history' ? 'active' : ''}`} onClick={() => setActivePanelTab('history')}>
                    🕐 History
                  </button>
                  <button className={`panel-tab ${activePanelTab === 'settings' ? 'active' : ''}`} onClick={() => setActivePanelTab('settings')}>
                    ⚙️ Settings
                  </button>
                </div>

                <div className="panel-content">
                  {activePanelTab === 'details' && (
                    <div style={{ display: 'flex', flexDirection: 'column', gap: '10px' }}>
                      <Accordion title="Selected File Details" defaultOpen={true} icon={<FileIcon size={12} />}>
                        {selectedFile ? (
                          <div style={{ display: 'flex', flexDirection: 'column', gap: '6px' }}>
                            <div><strong>Name:</strong> {selectedFile.name}</div>
                            <div><strong>Path:</strong> {selectedFile.path}</div>
                            <div><strong>Size:</strong> {selectedFile.size ? `${(selectedFile.size / 1024).toFixed(2)} KB` : "N/A"}</div>
                            <div><strong>Language:</strong> {selectedFile.language || "text"}</div>
                            <div><strong>Last Modified:</strong> {selectedFile.lastModified || "N/A"}</div>
                          </div>
                        ) : (
                          <div>No file selected.</div>
                        )}
                      </Accordion>

                      <Accordion title="Git Status Summary" defaultOpen={true}>
                        <div className="stat-grid">
                          <div className="stat-card">
                            <span className="stat-num">{changedCount}</span>
                            <span className="stat-label">Changed files</span>
                          </div>
                          <div className="stat-card">
                            <span className="stat-num">{stagedCount}</span>
                            <span className="stat-label">Staged files</span>
                          </div>
                        </div>
                      </Accordion>
                    </div>
                  )}

                  {activePanelTab === 'changelog' && (
                    <div className="chat-panel">
                      <div className="chat-header" style={{ padding: '0 0 8px 0', borderBottom: 'none' }}>
                        <div className="model-selector">
                          <select value={selectedModel} onChange={(e) => setSelectedModel(e.target.value)}>
                            <option value="auto">🤖 Auto-detect</option>
                            {availableModels.map(m => (
                              <option key={m.name} value={`${m.provider}://${m.name}`}>
                                {m.provider === 'ollama' ? '🏠' : '☁️'} {m.name} ({m.size})
                              </option>
                            ))}
                          </select>
                        </div>
                      </div>

                      <div className="chat-modes" style={{ padding: '4px 0', borderBottom: 'none' }}>
                        <button className={`mode-btn ${chatMode === 'chat' ? 'active' : ''}`} onClick={() => setChatMode('chat')}>
                          Chat
                        </button>
                        <button className={`mode-btn ${chatMode === 'changelog' ? 'active' : ''}`} onClick={() => setChatMode('changelog')}>
                          Changelog
                        </button>
                        <button className={`mode-btn ${chatMode === 'security' ? 'active' : ''}`} onClick={() => setChatMode('security')}>
                          Security
                        </button>
                        <button className={`mode-btn ${chatMode === 'explain' ? 'active' : ''}`} onClick={() => setChatMode('explain')}>
                          Explain
                        </button>
                      </div>

                      <div className="chat-messages">
                        {messages.length === 0 ? (
                          <div className="chat-welcome">
                            <SparklesIcon size={28} />
                            <h3>DevDiff AI Assistant</h3>
                            <p style={{ fontSize: '11px' }}>Ask questions about changes, audit security, or explain code structures.</p>
                            <div className="suggestion-chips">
                              <button onClick={() => sendMessage("Generate changelog")}>📝 Generate Changelog</button>
                              <button onClick={() => sendMessage("Check compliance status")}>🔒 Compliance check</button>
                            </div>
                          </div>
                        ) : (
                          messages.map(msg => (
                            <div key={msg.id} className={`chat-message ${msg.role}`}>
                              <div className="message-avatar">
                                {msg.role === 'user' ? <UserIcon size={14} /> : <BotIcon size={14} />}
                              </div>
                              <div className="message-content">
                                <div className="message-header">
                                  <span className="message-role">{msg.role === 'user' ? 'You' : 'DevDiff AI'}</span>
                                  {msg.model && <span className="message-model">{msg.model}</span>}
                                  {msg.confidence && <span className="message-confidence high">{msg.confidence}% conf</span>}
                                </div>
                                <div className="message-body">
                                  {msg.content}
                                </div>
                              </div>
                            </div>
                          ))
                        )}
                        {isStreaming && (
                          <div className="chat-message assistant">
                            <div className="typing-dots">
                              <span className="typing-dot"></span>
                              <span className="typing-dot"></span>
                              <span className="typing-dot"></span>
                            </div>
                          </div>
                        )}
                        <div ref={messagesEndRef} />
                      </div>

                      <div className="chat-input-container" style={{ padding: '8px 0 0 0' }}>
                        <div className="chat-input-wrapper">
                          <textarea
                            ref={chatInputRef}
                            className="chat-input"
                            placeholder="Message DevDiff AI..."
                            value={chatInput}
                            onChange={(e) => setChatInput(e.target.value)}
                            onKeyDown={(e) => {
                              if (e.key === 'Enter' && !e.shiftKey) {
                                e.preventDefault();
                                sendMessage();
                              }
                            }}
                          />
                          <div className="chat-input-actions">
                            <span>Press Enter to send</span>
                            <button className="dev-btn dev-btn-primary dev-btn-sm" onClick={() => sendMessage()}>
                              Send
                            </button>
                          </div>
                        </div>
                      </div>
                    </div>
                  )}

                  {activePanelTab === 'history' && (
                    <div style={{ display: 'flex', flexDirection: 'column', gap: '8px' }}>
                      <span className="section-title">Analysis History</span>
                      <div style={{ fontSize: '11px', color: 'var(--text-tertiary)', textAlign: 'center', padding: '20px' }}>
                        No analysis history found.
                      </div>
                    </div>
                  )}

                  {activePanelTab === 'settings' && (
                    <div style={{ display: 'flex', flexDirection: 'column', gap: '10px' }}>
                      <span className="section-title">Playground Settings</span>
                      <div style={{ display: 'flex', flexDirection: 'column', gap: '8px', fontSize: '12px' }}>
                        <label style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
                          <input type="checkbox" defaultChecked />
                          <span>Local AI Priority (Ollama)</span>
                        </label>
                        <label style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
                          <input type="checkbox" defaultChecked />
                          <span>Syntax highlighting on file preview</span>
                        </label>
                      </div>
                    </div>
                  )}
                </div>
              </div>
            </aside>

            {/* Status Bar */}
            <footer className="playground-statusbar">
              <div>
                <span>Workspace: <strong>{workspace ? workspace.path : "N/A"}</strong></span>
              </div>
              <div style={{ display: 'flex', gap: '12px' }}>
                <span>Session: <strong id="session-timer">{formatSessionTime(sessionSeconds)}</strong></span>
                <span>Keyboard Shortcuts: <strong>Ctrl+L (Chat)</strong> | <strong>Ctrl+P (Project)</strong></span>
              </div>
            </footer>

            {/* Bottom Mobile Tab Bar */}
            <div className="mobile-tab-bar">
              <button
                className={`mobile-tab ${mobileViewTab === 'explorer' ? 'active' : ''}`}
                onClick={() => setMobileViewTab('explorer')}
              >
                <span>📂</span>
                <span>Explorer</span>
              </button>
              <button
                className={`mobile-tab ${mobileViewTab === 'editor' ? 'active' : ''}`}
                onClick={() => setMobileViewTab('editor')}
              >
                <span>📝</span>
                <span>Editor</span>
              </button>
              <button
                className={`mobile-tab ${mobileViewTab === 'chat' ? 'active' : ''}`}
                onClick={() => {
                  setMobileViewTab('chat');
                  setActivePanelTab('changelog');
                }}
              >
                <span>💬</span>
                <span>AI Chat</span>
              </button>
              <button
                className={`mobile-tab ${mobileViewTab === 'settings' ? 'active' : ''}`}
                onClick={() => {
                  setMobileViewTab('settings');
                  setActivePanelTab('settings');
                }}
              >
                <span>⚙️</span>
                <span>Settings</span>
              </button>
            </div>

            {/* Project Switcher Modal */}
            {isProjectSwitcherOpen && (
              <>
                <div className="modal-overlay" onClick={() => setIsProjectSwitcherOpen(false)} />
                <div className="project-switcher-modal" role="dialog">
                  <div className="modal-header">
                    <h2>Switch Developer Workspace</h2>
                    <button className="dev-btn dev-btn-ghost dev-btn-icon" onClick={() => setIsProjectSwitcherOpen(false)}>
                      <XIcon size={14} />
                    </button>
                  </div>
                  <div className="modal-body">
                    <button className="open-folder-btn" onClick={() => {
                      const path = prompt("Enter the absolute folder path:");
                      if (path) switchProject(path);
                    }}>
                      <div className="open-folder-text">
                        <strong>Open local repository</strong>
                        <span>Type absolute path to workspace folder</span>
                      </div>
                    </button>

                    {recentProjects.length > 0 && (
                      <div className="recent-projects">
                        <span className="section-title">Recent Workspace folders</span>
                        <div className="recent-list">
                          {recentProjects.map(proj => (
                            <button key={proj.path} className="recent-item" onClick={() => switchProject(proj.path)}>
                              <div className="recent-info">
                                <span className="recent-name">{proj.name}</span>
                                <span className="recent-path">{proj.path}</span>
                              </div>
                            </button>
                          ))}
                        </div>
                      </div>
                    )}
                  </div>
                </div>
              </>
            )}
          </div>
        );
      };

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
